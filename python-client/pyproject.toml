[project]
name = "mip-client"
version = "0.2.1"
description = "Python client for MIP federated analysis through platform-backend"
authors = [{ name = "Konstantinos Filippopolitis" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.25.0,<3.0.0",
    "pandas>=1.0.0,<4.0.0",
    "numpy>=1.21.0,<3.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
]

[project.scripts]
mip = "mip.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0.0", "jinja2>=3.0.0,<4.0.0"]  # jinja2: DataFrame.style in tests
notebook = [
    "ipython>=8.0.0,<10.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "ipywidgets>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Distribution is mip-client; the import name stays `mip`.
[tool.hatch.build.targets.wheel]
packages = ["mip"]
