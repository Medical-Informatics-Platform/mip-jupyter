[project]
name = "mip"
version = "0.1.0"
description = "Notebook-facing Python client for the MIP platform analysis API"
authors = [{ name = "Konstantinos Filippopolitis" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.25.0,<3.0.0",
    "pandas>=1.0.0,<4.0.0",
    "numpy>=1.21.0,<3.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0.0"]
notebook = [
    "ipython>=8.0.0,<10.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "ipywidgets>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
