# Add entries here only with a CVE id, a reason, and a removal condition.
vulnerabilities:
  # pip 26.3 (latest) vendors setuptools 70.3.0 under pip/_vendor and
  # re-vendors msgpack 1.2.4 and urllib3 2.8.0, so those earlier pins are gone.
  # Trivy reports the setuptools copy with no file path, so scope by the exact
  # vendored purl; the venv's own setuptools stays scanned. Remove once a pip
  # release re-vendors a fixed setuptools.
  - id: CVE-2025-47273
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    statement: "pip-vendored pkg_resources only; setuptools.package_index (the vulnerable module) is not vendored by pip."
    expires: 2026-12-31
  - id: CVE-2026-59890
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    statement: "pip-vendored pkg_resources only; the vulnerable sdist/MANIFEST.in code is not vendored by pip."
    expires: 2026-12-31
