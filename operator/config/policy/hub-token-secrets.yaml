# The hub needs `secrets: create` for its token Secrets. Unchecked, that would
# let a compromised hub create a kubernetes.io/service-account-token Secret,
# which the API server fills with any ServiceAccount's token, under the name the
# operator mounts. Only Opaque <notebook>-<uid>-token Secrets owned by that
# Notebook are admitted. Cluster-scoped; needs Kubernetes 1.30+.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mip-hub-token-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    # The hub's ServiceAccount (madgik/mip chart) in any federation namespace.
    - name: jupyterhub
      expression: request.userInfo.username.matches('^system:serviceaccount:[^:]+:jupyterhub$')
  validations:
    - expression: >-
        object.type == 'Opaque' &&
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(r,
          r.apiVersion.startsWith('notebooks.mip.ebrains.eu/') && r.kind == 'Notebook' &&
          object.metadata.name == r.name + '-' + r.uid + '-token')
      message: the hub may only create Opaque <notebook>-<uid>-token Secrets owned by that Notebook
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mip-hub-token-secrets
spec:
  policyName: mip-hub-token-secrets
  validationActions: [Deny]
