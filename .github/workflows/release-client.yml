name: Release mip-client

# Every release also ships the client, at the release's version, on the same release.
on:
  release:
    types: [published]

jobs:
  release:
    # Pre-releases (e.g. 0.1.2_candidate) are image candidates only.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: python-client
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Fail if the tag and python-client/pyproject.toml disagree.
      - run: test "$(uv version --short)" = "$TAG"
      - run: uv build
      # Release assets are immutable, so consumers can lock their hashes.
      - run: gh release upload "$TAG" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
