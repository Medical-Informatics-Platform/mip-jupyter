name: Release mip-client

# Every release also publishes the client to PyPI, at the release's version.
# Published GitHub releases are immutable, so the wheel and sdist go to PyPI instead of
# being attached to the release.
on:
  release:
    types: [published]

jobs:
  release:
    # Pre-releases (e.g. 0.1.2_candidate) are image candidates only.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the PyPI project trusts this repository, workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/project/mip-client/${{ github.event.release.tag_name }}/
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # Fail if the tag and python-client/pyproject.toml disagree.
      - run: test "$(uv version --short)" = "$TAG"
        working-directory: python-client
      - run: uv build --out-dir dist
        working-directory: python-client
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python-client/dist/
