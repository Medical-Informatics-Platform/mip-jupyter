name: Publish staging images

on:
  push:
    branches: [staging-a, staging-b]
  workflow_dispatch:

concurrency: staging-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build staging images and push to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mip-jupyter
            context: .
            dockerfile: docker/singleuser/Dockerfile
            cache-scope: singleuser
          - image: mip-jupyterhub
            context: .
            dockerfile: docker/hub/Dockerfile
            cache-scope: hub

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with:
          images: hbpmip/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ github.sha:0:7 }}

      - name: Build ${{ matrix.image }} docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=max

  bump-hub:
    name: Bump jupyterhub image tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Bump staging image (jupyterhub)
        uses: Medical-Informatics-Platform/mip/.github/workflows/bump-staging-image.yml@master
        with:
          key: jupyterhub.image.tag
          image: hbpmip/mip-jupyterhub:${{ github.ref_name }}-${{ github.sha:0:7 }}
        secrets:
          app-id: ${{ secrets.STAGING_BUMP_APP_ID }}
          private-key: ${{ secrets.STAGING_BUMP_APP_PRIVATE_KEY }}

  bump-singleuser:
    name: Bump singleuser image tag
    needs: bump-hub
    runs-on: ubuntu-latest
    steps:
      - name: Bump staging image (singleuser)
        uses: Medical-Informatics-Platform/mip/.github/workflows/bump-staging-image.yml@master
        with:
          key: jupyterhub.singleuser.image.tag
          image: hbpmip/mip-jupyter:${{ github.ref_name }}-${{ github.sha:0:7 }}
        secrets:
          app-id: ${{ secrets.STAGING_BUMP_APP_ID }}
          private-key: ${{ secrets.STAGING_BUMP_APP_PRIVATE_KEY }}
