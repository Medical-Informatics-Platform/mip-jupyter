name: Publish staging images

on:
  push:
    branches: [staging-b, staging-c]
  workflow_dispatch:

concurrency: staging-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} staging image and push to Docker Hub
    runs-on: ubuntu-latest
    # Same value from every matrix leg: <branch>-<short sha>.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mip-jupyter
            context: .
            dockerfile: docker/singleuser/Dockerfile
            cache-scope: singleuser
          - image: mip-jupyterhub
            context: .
            dockerfile: docker/hub/Dockerfile
            cache-scope: hub

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Expressions cannot slice strings; the shell can.
      - name: Staging tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 #v6.2.0
        with:
          images: hbpmip/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build ${{ matrix.image }} docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=max

  # Reusable workflow: called as a job. The chart keys take the tag alone, not the image reference.
  bump-hub:
    name: Bump jupyterhub image tag
    needs: build
    uses: Medical-Informatics-Platform/mip/.github/workflows/bump-staging-image.yml@0eff4dd7667262adf39284c7585f2b8ee75dd034 # mip PR #33 (chore/bump-staging-workflow); switch to @master once merged
    with:
      branch: ${{ github.ref_name }}
      key: jupyterhub.image.tag
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      app-id: ${{ secrets.STAGING_BUMP_APP_ID }}
      private-key: ${{ secrets.STAGING_BUMP_APP_PRIVATE_KEY }}

  # After bump-hub: both commit to the same mip staging branch.
  bump-singleuser:
    name: Bump singleuser image tag
    needs: [build, bump-hub]
    uses: Medical-Informatics-Platform/mip/.github/workflows/bump-staging-image.yml@0eff4dd7667262adf39284c7585f2b8ee75dd034 # mip PR #33 (chore/bump-staging-workflow); switch to @master once merged
    with:
      branch: ${{ github.ref_name }}
      key: jupyterhub.singleuser.image.tag
      tag: ${{ needs.build.outputs.tag }}
    secrets:
      app-id: ${{ secrets.STAGING_BUMP_APP_ID }}
      private-key: ${{ secrets.STAGING_BUMP_APP_PRIVATE_KEY }}
