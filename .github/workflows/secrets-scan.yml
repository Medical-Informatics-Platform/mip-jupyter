name: Secret Scanning (gitleaks)

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_SARIF_OUTPUT: gitleaks.sarif

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install gitleaks
        run: bash ci/setup-tools.sh --install-tool gitleaks

      - name: Install and run gitleaks
        run: >
          gitleaks dir .
          --config ci/suppress_gitleaks.toml
          --redact
          --report-format sarif
          --report-path "$GITLEAKS_SARIF_OUTPUT"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ee07b503f465bcf3338b6e4807a36789e3106f4b #v2.25.6
        with:
          sarif_file: ${{ env.GITLEAKS_SARIF_OUTPUT }}
          category: gitleaks
