name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install root package and dev deps
        run: uv sync --extra dev
      # The Codex persona refuses to import unless the codex-acp binary is on PATH.
      - name: Install codex-acp
        run: npm install -g @zed-industries/codex-acp
      - name: Python tests
        run: uv run pytest dev python-client/tests -q
      - name: Smoke script
        run: uv run python python-client/verify_script.py
      # Whole tree against the empty tree; a bare `git diff --check` sees nothing on a fresh checkout.
      - name: Whitespace check
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  # The client alone, without the notebook workspace: proves python-client/ stays self-contained.
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: python-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra notebook
      - run: uv run pytest -q
      - run: uv run python verify_script.py
      - run: uv build

  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      # Regenerates CRDs/RBAC/deepcopy first; a diff means they were not committed.
      - name: Generated files are up to date
        run: make manifests generate && git diff --exit-code
      - name: Controller tests (envtest)
        run: make test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Layer cache in GitHub Actions: only changed layers rebuild (deps layer until uv.lock changes).
      - name: Build notebook image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/singleuser/Dockerfile
          platforms: linux/amd64
          tags: mip-jupyter:ci
          load: true
          cache-from: type=gha,scope=singleuser
          cache-to: type=gha,scope=singleuser,mode=max
      - name: Build hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/hub/Dockerfile
          platforms: linux/amd64
          tags: mip-jupyterhub:ci
          load: true
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
      - name: Build notebook operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: operator
          platforms: linux/amd64
          tags: mip-notebook-operator:ci
          cache-from: type=gha,scope=operator
          cache-to: type=gha,scope=operator,mode=max
      - name: Hub tests
        run: >-
          docker run --rm -w /etc/jupyterhub
          -v "$PWD/docker/hub/test_notebook_spawner.py:/etc/jupyterhub/test_notebook_spawner.py:ro"
          -v "$PWD/docker/hub/test_platform_token_service.py:/etc/jupyterhub/test_platform_token_service.py:ro"
          mip-jupyterhub:ci python -m unittest test_notebook_spawner test_platform_token_service
      - name: Single-user image smoke
        run: scripts/smoke-singleuser-image.sh mip-jupyter:ci
